# Official TMAP Vector JS SDK public API manifest.
# Source: WebDocs.html, its official samples, and linked TData REST references.
# A done row requires an existing Dart symbol and an observable test assertion.
sdk:
  docs_url: https://tmapapi.tmapmobility.com/webv3VSM/docs/WebDocs.html
  core_url: https://topopentile1.tmap.co.kr/scriptSDKV3/tmapjs3.min.js?version=20231206
  core_sha256: 5290e0fd7428e7d7185c75e60666adb8a5f804f84bbc57b7245d60ecbc61b66e
entries:

  # Map
  - id: "Tmapv3.Map"
    kind: class
    decision: adapt
    status: done
    dart: TMap
    tests:
      - "example/test_driver/bridge/map_contract_scenario.dart::ConfigLoad creates typed Flutter TMapController once"
    reason: "The JS DOM-bound map is created by the Flutter TMap widget and controlled through TMapController."
