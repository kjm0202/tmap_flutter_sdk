# SonarQube Cloud (https://sonarcloud.io) settings for CI-based analysis.
# Run by .github/workflows/sonarcloud.yml; Automatic Analysis must be off.
# Organization and project key come from SonarSource/sonarqube-auth-action.

# Plugin code: Dart under lib/ and the JS bridge loaded into the WebView.
sonar.sources=lib,assets/bridge
sonar.tests=test
sonar.sourceEncoding=UTF-8
# Browser-backed Dart web adapters need browser integration coverage; exclude them
# from coverage metrics while retaining their static analysis.
sonar.coverage.exclusions=lib/src/web/**

# Produced by `flutter test --coverage`.
sonar.dart.lcov.reportPaths=coverage/lcov.info
# Produced by the Node 22 test runner's LCOV reporter.
sonar.javascript.lcov.reportPaths=coverage/js-lcov.info
