name: tmap_flutter_sdk
description: A Flutter plugin for TMAP (SK Open API) Vector Map v3. Supports 3D camera control, markers, clustering, geometries, route planning, and POI search.
version: 0.1.0
repository: https://github.com/kjm0202/tmap_flutter_sdk
issue_tracker: https://github.com/kjm0202/tmap_flutter_sdk/issues

topics:
  - maps
  - tmap
  - navigation
  - location
  - flutter

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: '>=1.1.0 <2.0.0'
  plugin_platform_interface: '>=2.1.7 <3.0.0'
  web: '>=0.5.1 <2.0.0'
  webview_flutter: '>=4.7.0 <5.0.0'
  webview_flutter_android: '>=3.15.0 <5.0.0'
  webview_flutter_web: '>=0.2.2 <0.3.0'
  webview_flutter_wkwebview: '>=3.12.0 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <6.0.0'

flutter:
