name: tmap_flutter_sdk
description: A Flutter plugin for TMAP (SK Open API) Vector Map v3. Supports 3D camera control, markers, clustering, geometries, route planning, and POI search.
version: 0.1.0
repository: https://github.com/kjm0202/tmap_flutter_sdk
issue_tracker: https://github.com/kjm0202/tmap_flutter_sdk/issues

topics:
  - maps
  - tmap
  - navigation
  - location
  - flutter

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.6.0
  plugin_platform_interface: ^2.1.8
  webview_flutter: ^4.12.0
  webview_flutter_android: ^4.7.0
  webview_flutter_web: ^0.2.3+4
  webview_flutter_wkwebview: ^3.22.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter: